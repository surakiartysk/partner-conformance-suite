name = "points-partner"
main = "src/index.ts"
compatibility_date = "2024-12-18"

# Reached at its workers.dev address only. Preview URLs would be a second way in
# to the same Worker, one per version, so they stay off.
workers_dev = true
preview_urls = false

# The reference partner keeps its own database. It stands in for a partner's
# system, so it shares nothing with the provider's side — not a database, not
# a secret, not a line of code.
[[d1_databases]]
binding = "DB"
database_name = "points-partner"
# Read at deploy time only; local runs resolve by database_name.
database_id = "72adce99-a003-473e-af0c-38de3543cc7c"
migrations_dir = "migrations"

# Secrets — `wrangler secret put` for a deployment, `.dev.vars` locally:
#   PROVISION_TOKEN   guards POST /_provision. There is deliberately no default:
#                     unset, provisioning answers 503 rather than accepting a
#                     token anyone could read in this file.

# Forgets expired tenants and old webhook-ids. See src/purge.ts.
[triggers]
crons = ["*/10 * * * *"]
