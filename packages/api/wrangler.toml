name = "conformance-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"

# Reached at its workers.dev address only. Preview URLs would be a second way in
# to the same Worker, one per version, so they stay off.
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "conformance-api"
# Read at deploy time only; local runs resolve by database_name.
database_id = "9851275c-26aa-4c43-9c20-57b14d643c78"
migrations_dir = "migrations"

# The reference partner, reached through a service binding rather than the
# public internet. The suite never takes a partner URL from a request: this
# binding and PARTNER_ORIGIN below are the only places a partner comes from.
[[services]]
binding = "PARTNER"
service = "points-partner"

[vars]
# Shown to the visitor as the partner's base URL, and used to build the URL of
# each request. The service binding decides where the request actually goes, so
# this is the partner's public address, which a visitor can reach too.
PARTNER_ORIGIN = "https://points-partner.surakiart-ysk.workers.dev"

# Secrets — `wrangler secret put` for a deployment, `.dev.vars` locally. None
# has a default: unset, the endpoints that need one answer 503.
#   PROVISION_TOKEN   must equal the reference partner's PROVISION_TOKEN
#   SECRET_KEY        32 random bytes, base64 — encrypts the signing secrets

# The sweep: pays back balances owed by runs that did not finish, and deletes
# sessions that have ended. See src/sweeper.ts.
[triggers]
crons = ["*/10 * * * *"]

# The page the visitor uses, served by this Worker so that the page and the API
# share an origin (decision 27). The API answers `/api/*`; every other path is
# a file from the UI's build, and an unknown one falls back to the page itself
# so that /connection survives a reload. Build it first: `pnpm --filter
# @conformance/ui build`.
[assets]
directory = "../ui/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
